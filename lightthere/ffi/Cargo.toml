[package]
name = "loki-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C ABI over the LightCraft engine for the LightThere Kotlin Multiplatform front end"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
lightcraft-mcp = { path = "../../crates/mcp" }
lightcraft-engine = { path = "../../crates/engine" }
lightcraft-raster = { path = "../../crates/raster" }
serde_json = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
